<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>urlstat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M2 14V9h3v5zM6.5 14V5h3v9zM11 14V2h3v12z' fill='%232a78d6'/%3E%3C/svg%3E">
<style>
/* Colors by the job they do. The two series colors are validated for both
   surfaces (lightness band, chroma, colorblind separation, contrast). */
:root {
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11, 11, 11, 0.1); --wash: rgba(11, 11, 11, 0.045);
  --pv: #2a78d6; --uv: #eb6834; --up: #006300; --down: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255, 255, 255, 0.1); --wash: rgba(255, 255, 255, 0.06);
    --pv: #3987e5; --uv: #d95926; --up: #0ca30c; --down: #e66767;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: inherit; }
button, select, input { font: inherit; color: inherit; }
main { max-width: 1160px; margin: 0 auto; padding: 14px 16px 28px; }

.top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.top h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
.top p { margin: 0; color: var(--ink-2); }
.top a { margin-left: auto; color: var(--ink-2); text-decoration: none; }
.top a:hover { color: var(--ink); text-decoration: underline; }

/* One filter row; everything below it shows the same slice. */
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 10px; }
.filters select { height: 28px; padding: 0 26px 0 9px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); max-width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { height: 26px; padding: 0 10px; border: 0; background: none; cursor: pointer; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--border); }
.seg button:hover { background: var(--wash); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; color: var(--ink-2); min-width: 0; }
.crumbs button { border: 0; background: none; padding: 3px 5px; border-radius: 4px; cursor: pointer; color: var(--ink-2); }
.crumbs button:hover { background: var(--wash); color: var(--ink); }
.crumbs .here { padding: 3px 5px; color: var(--ink); font-weight: 600; }
.crumbs .sep { color: var(--muted); }
.status { margin-left: auto; color: var(--ink-2); }
.status.error { color: var(--down); }
:focus-visible { outline: 2px solid var(--pv); outline-offset: 1px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
.busy .live { opacity: 0.5; transition: opacity 0.15s; }

.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 10px; }
.tile { padding: 10px 14px 11px; min-width: 0; }
.tile .label { color: var(--ink-2); }
.tile .value { font-size: 24px; font-weight: 650; line-height: 1.2; letter-spacing: -0.01em; margin-top: 1px; }
.tile .note { color: var(--ink-2); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .note .up { color: var(--up); font-weight: 600; }
.tile .note .down { color: var(--down); font-weight: 600; }

.head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 9px 14px 0; min-height: 34px; }
.head h2 { margin: 0; font-size: 13px; font-weight: 650; }
.head .count { color: var(--ink-2); }
.head .right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.legend { display: flex; gap: 12px; color: var(--ink-2); white-space: nowrap; }
.legend i { display: inline-block; width: 14px; height: 2px; border-radius: 1px; vertical-align: middle; margin-right: 5px; }
.link { border: 0; background: none; padding: 2px 0; cursor: pointer; white-space: nowrap; color: var(--ink-2); text-decoration: underline; text-underline-offset: 2px; }
.link:hover { color: var(--ink); }

.chart { margin-bottom: 10px; }
.plot { position: relative; padding: 4px 8px 6px; }
.plot svg { display: block; width: 100%; height: 232px; overflow: visible; outline-offset: -2px; }
.plot text { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.tip { position: absolute; top: 8px; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12); white-space: nowrap; display: none; }
.tip .day { color: var(--ink-2); margin-bottom: 2px; }
.tip .row { display: flex; align-items: center; gap: 6px; }
.tip .row i { width: 12px; height: 2px; border-radius: 1px; }
.tip .row b { font-weight: 650; min-width: 4ch; font-variant-numeric: tabular-nums; }
.tip .row span { color: var(--ink-2); }
.empty { padding: 28px 14px; text-align: center; color: var(--ink-2); }

.cols { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 8fr); gap: 10px; align-items: start; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
th, td { padding: 5px 0 5px 14px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
th:last-child, td:last-child { padding-right: 14px; }
th { font-weight: 500; color: var(--ink-2); font-size: 12px; border-bottom: 1px solid var(--grid); }
tbody tr + tr td { border-top: 1px solid var(--grid); }
tbody tr:hover td { background: var(--wash); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; width: 76px; }
td.bar { width: 22%; }
td.bar i { display: block; height: 6px; min-width: 2px; border-radius: 0 3px 3px 0; background: var(--pv); }
th button { border: 0; background: none; padding: 0; cursor: pointer; color: inherit; font-weight: inherit; }
th button:hover { color: var(--ink); }
th[aria-sort="descending"] button { color: var(--ink); font-weight: 650; }
td a { text-decoration: none; }
td a:hover { text-decoration: underline; }
td .name { display: flex; align-items: baseline; gap: 7px; min-width: 0; }
td .name > :first-child { flex: 0 1 auto; min-width: 3ch; overflow: hidden; text-overflow: ellipsis; }
td .sub { flex: 0 1000 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-size: 12px; }
.drill { border: 0; background: none; padding: 0; cursor: pointer; text-align: left; }
.drill:hover { text-decoration: underline; }
/* The section table is narrow; its counts say enough without bars. */
#sections td.bar, #sections th.bar { display: none; }
.more { padding: 8px 14px 10px; border-top: 1px solid var(--grid); color: var(--ink-2); }
.search { height: 26px; width: 190px; max-width: 46vw; padding: 0 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--page); }
.scroll { max-height: 232px; overflow: auto; margin-top: 4px; }
.foot { margin-top: 12px; color: var(--ink-2); font-size: 12px; }

@media (max-width: 820px) {
  .tiles { grid-template-columns: repeat(2, 1fr); }
  .cols { grid-template-columns: minmax(0, 1fr); }
  .top p { display: none; }
  td.bar, th.bar { display: none; }
  .tile .note { white-space: normal; }
  #pages td:first-child { white-space: normal; overflow-wrap: anywhere; }
}
</style>
</head>
<body>
<main id="app" class="busy">
  <header class="top">
    <h1>urlstat</h1>
    <p>Page views and visitors</p>
    <a href="https://github.com/changkun/urlstat">github.com/changkun/urlstat</a>
  </header>

  <div class="filters">
    <select id="host" aria-label="Host"></select>
    <div class="seg" id="days" role="group" aria-label="Period">
      <button data-days="7">7 days</button><button data-days="30">30 days</button><button data-days="90">90 days</button><button data-days="365">1 year</button>
    </div>
    <nav class="crumbs" id="crumbs" aria-label="Path"></nav>
    <span class="status" id="status" role="status">Loading…</span>
  </div>

  <section class="tiles live" aria-label="Totals">
    <div class="card tile"><div class="label">Page views</div><div class="value" id="t-pv">–</div><div class="note" id="n-pv">&nbsp;</div></div>
    <div class="card tile"><div class="label">Visitors</div><div class="value" id="t-uv">–</div><div class="note" id="n-uv">&nbsp;</div></div>
    <div class="card tile"><div class="label">Views per visitor</div><div class="value" id="t-per">–</div><div class="note" id="n-per">&nbsp;</div></div>
    <div class="card tile"><div class="label">Pages viewed</div><div class="value" id="t-pages">–</div><div class="note" id="n-pages">&nbsp;</div></div>
  </section>

  <figure class="card chart live" style="margin-left:0;margin-right:0;margin-top:0">
    <div class="head">
      <h2>Daily views and visitors</h2>
      <div class="right">
        <div class="legend" id="legend"><span><i style="background:var(--pv)"></i>Page views</span><span><i style="background:var(--uv)"></i>Visitors</span></div>
        <button class="link" id="view" aria-pressed="false">Show as table</button>
      </div>
    </div>
    <div class="plot" id="plot"><svg id="svg" role="img" tabindex="0" aria-label="Daily page views and visitors. Use the arrow keys to read each day, or show the table."></svg><div class="tip" id="tip"></div></div>
    <div class="scroll" id="daily" hidden></div>
  </figure>

  <div class="cols live">
    <section class="card" aria-label="Sections">
      <div class="head"><h2>Sections</h2><span class="count" id="sec-count"></span></div>
      <div id="sections"></div>
    </section>
    <section class="card" aria-label="Pages">
      <div class="head"><h2>Pages</h2><span class="count" id="page-count"></span>
        <div class="right"><input class="search" id="q" type="search" placeholder="Filter pages" aria-label="Filter pages"></div>
      </div>
      <div id="pages"></div>
    </section>
  </div>

  <p class="foot">Visitors are distinct IP addresses over the period. Days are in UTC, and today is still being counted. Figures can be a few minutes behind.</p>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const fmt = new Intl.NumberFormat('en-US');
  const PERIODS = { 7: '7 days', 30: '30 days', 90: '90 days', 365: 'year' };
  const state = { host: '', days: 30, prefix: '', sort: 'pv', q: '', all: false, allSections: false, table: false };
  let data = null, series = [], seq = 0, hover = -1;

  // Text from the database (hosts, paths) only ever enters the page as text.
  function el(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === 'text') e.textContent = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (v !== false && v != null) e.setAttribute(k, v);
    }
    e.append(...kids.filter((k) => k != null));
    return e;
  }

  function readURL() {
    const p = new URLSearchParams(location.search);
    state.host = p.get('host') || '';
    state.days = PERIODS[+p.get('days')] ? +p.get('days') : 30;
    state.prefix = p.get('prefix') || '';
  }
  function writeURL(push) {
    const p = new URLSearchParams();
    if (state.host) p.set('host', state.host);
    if (state.days !== 30) p.set('days', state.days);
    if (state.prefix) p.set('prefix', state.prefix);
    const url = location.pathname + (p.toString() ? '?' + p : '');
    if (url !== location.pathname + location.search) history[push ? 'pushState' : 'replaceState'](null, '', url);
  }

  async function load(push) {
    const mine = ++seq;
    $('app').classList.add('busy');
    if (!data) status('Loading…');
    const p = new URLSearchParams({ days: state.days });
    if (state.host) p.set('hostname', state.host);
    if (state.prefix) p.set('prefix', state.prefix);
    try {
      const r = await fetch('/urlstat/dashboard/api?' + p);
      if (!r.ok) throw new Error((await r.text()).trim() || r.statusText);
      const d = await r.json();
      if (mine !== seq) return;
      data = d;
      state.host = d.hostname; state.prefix = d.prefix || ''; state.all = false; state.allSections = false;
      writeURL(push);
      render();
      status('');
    } catch (e) {
      if (mine === seq) status('Could not load the statistics: ' + e.message, true);
    } finally {
      if (mine === seq) $('app').classList.remove('busy');
    }
  }
  function status(text, error) {
    $('status').textContent = text;
    $('status').classList.toggle('error', !!error);
  }

  function render() {
    renderFilters(); renderTiles(); fillDays(); renderChart(); renderDaily(); renderSections(); renderPages();
  }

  function renderFilters() {
    const sel = $('host');
    sel.replaceChildren(...data.hosts.map((h) => el('option', { value: h.hostname, text: h.hostname + (h.pv ? '  ·  ' + fmt.format(h.pv) : '  ·  no visits') })));
    if (!data.hosts.some((h) => h.hostname === state.host) && state.host) sel.prepend(el('option', { value: state.host, text: state.host }));
    sel.value = state.host;
    for (const b of $('days').children) b.setAttribute('aria-pressed', String(+b.dataset.days === state.days));

    // The path being looked at, each part a way back up.
    const parts = state.prefix.split('/').filter(Boolean);
    const crumbs = [];
    if (parts.length) {
      crumbs.push(el('button', { text: 'All pages', onclick: () => go({ prefix: '' }) }));
      parts.forEach((part, i) => {
        crumbs.push(el('span', { class: 'sep', text: '/' }));
        const to = '/' + parts.slice(0, i + 1).join('/');
        crumbs.push(i === parts.length - 1 ? el('span', { class: 'here', text: part }) : el('button', { text: part, onclick: () => go({ prefix: to }) }));
      });
    }
    $('crumbs').replaceChildren(...crumbs);
  }

  function delta(cur, prev) {
    const period = 'previous ' + PERIODS[state.days];
    if (!prev) return el('span', { text: cur ? 'none in the ' + period : ' ' });
    const pct = (cur - prev) / prev * 100;
    const flat = Math.abs(pct) < 0.5;
    const mark = el('span', { class: flat ? '' : pct > 0 ? 'up' : 'down', text: flat ? 'no change' : (pct > 0 ? '▲ ' : '▼ ') + (Math.abs(pct) >= 100 ? Math.round(Math.abs(pct)) : Math.abs(pct).toFixed(1)) + '%' });
    return el('span', {}, mark, ' vs ' + period);
  }
  function renderTiles() {
    const s = data.summary;
    $('t-pv').textContent = fmt.format(s.total_pv);
    $('t-uv').textContent = fmt.format(s.total_uv);
    $('t-per').textContent = s.total_uv ? (s.total_pv / s.total_uv).toFixed(2) : '–';
    $('t-pages').textContent = fmt.format(s.pages);
    $('n-pv').replaceChildren(delta(s.total_pv, s.prev_pv));
    $('n-uv').replaceChildren(delta(s.total_uv, s.prev_uv));
    $('n-per').textContent = s.prev_uv ? (s.prev_pv / s.prev_uv).toFixed(2) + ' in the previous ' + PERIODS[state.days] : ' ';
    $('n-pages').textContent = state.prefix ? 'under ' + state.prefix : 'on ' + state.host;
  }

  // Every day of the period, including the days nobody came.
  function fillDays() {
    const by = new Map(data.timeseries.map((t) => [t.date, t]));
    const today = new Date(); today.setUTCHours(0, 0, 0, 0);
    series = [];
    for (let i = state.days - 1; i >= 0; i--) {
      const d = new Date(today.getTime() - i * 864e5), key = d.toISOString().slice(0, 10), t = by.get(key);
      series.push({ date: d, key, pv: t ? t.pv : 0, uv: t ? t.uv : 0, today: i === 0 });
    }
  }
  const dayLabel = (d, year) => d.toLocaleDateString('en-US', { timeZone: 'UTC', month: 'short', day: 'numeric', ...(year ? { year: 'numeric' } : {}) });

  // A round axis maximum and step for about four gridlines.
  function axis(max) {
    if (max <= 4) return { top: 4, step: 1 };
    const raw = max / 4, mag = 10 ** Math.floor(Math.log10(raw));
    const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw && Number.isInteger(s)) || 10 * mag;
    return { top: Math.ceil(max / step) * step, step };
  }

  let geom = null;
  function renderChart() {
    const svg = $('svg'), W = svg.clientWidth || 800, H = 232;
    const total = series.reduce((a, s) => a + s.pv, 0);
    $('plot').hidden = state.table; $('legend').hidden = state.table;
    if (state.table) return;
    if (!total) { svg.innerHTML = `<text x="${W / 2}" y="${H / 2}" text-anchor="middle" style="font-size:13px">No visits in this period.</text>`; geom = null; return; }
    const { top, step } = axis(Math.max(...series.map((s) => s.pv)));
    const m = { l: 8 + String(fmt.format(top)).length * 6.4, r: 12, t: 10, b: 22 };
    const pw = W - m.l - m.r, ph = H - m.t - m.b, n = series.length;
    const x = (i) => m.l + (n > 1 ? (i / (n - 1)) * pw : pw / 2), y = (v) => m.t + ph - (v / top) * ph;
    geom = { x, y, m, pw, ph, W, H, n };
    let g = '';
    for (let v = 0; v <= top; v += step) {
      g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--${v ? 'grid' : 'axis'})"/>`;
      g += `<text x="${m.l - 7}" y="${y(v) + 3.5}" text-anchor="end">${fmt.format(v)}</text>`;
    }
    // Date labels: month starts for a long period, else evenly spaced days
    // counted back from today.
    const ticks = [];
    if (n > 120) series.forEach((s, i) => { if (s.date.getUTCDate() === 1 && (pw > 520 || s.date.getUTCMonth() % 2 === 0)) ticks.push([i, s.date.toLocaleDateString('en-US', { timeZone: 'UTC', month: 'short' }) + (s.date.getUTCMonth() === 0 ? ' ' + s.date.getUTCFullYear() : '')]); });
    else { const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(pw / 80)))); for (let i = n - 1; i >= 0; i -= every) ticks.push([i, dayLabel(series[i].date)]); }
    for (const [i, label] of ticks) {
      const anchor = x(i) > W - m.r - 24 ? 'end' : x(i) < m.l + 24 ? 'start' : 'middle';
      g += `<text x="${x(i)}" y="${H - 5}" text-anchor="${anchor}">${label}</text>`;
    }
    const line = (k) => series.map((s, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(s[k]).toFixed(1)}`).join('');
    g += `<path d="${line('pv')}L${x(n - 1).toFixed(1)},${y(0)}L${x(0).toFixed(1)},${y(0)}Z" fill="var(--pv)" opacity="0.1"/>`;
    g += `<path d="${line('pv')}" fill="none" stroke="var(--pv)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    g += `<path d="${line('uv')}" fill="none" stroke="var(--uv)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    g += `<g id="cross" visibility="hidden"><line id="cx" y1="${m.t}" y2="${m.t + ph}" stroke="var(--axis)"/><circle id="c-pv" r="4" fill="var(--pv)" stroke="var(--surface)" stroke-width="2"/><circle id="c-uv" r="4" fill="var(--uv)" stroke="var(--surface)" stroke-width="2"/></g>`;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.innerHTML = g;
    point(hover >= 0 && hover < n ? hover : -1);
  }

  // The reading at day i: a hairline, a dot on each line, and the numbers.
  function point(i) {
    hover = i;
    const cross = document.getElementById('cross'), tip = $('tip');
    if (!geom || !cross) { tip.style.display = 'none'; return; }
    if (i < 0) { cross.setAttribute('visibility', 'hidden'); tip.style.display = 'none'; return; }
    const s = series[i], { x, y, W } = geom;
    cross.setAttribute('visibility', 'visible');
    document.getElementById('cx').setAttribute('x1', x(i)); document.getElementById('cx').setAttribute('x2', x(i));
    document.getElementById('c-pv').setAttribute('cx', x(i)); document.getElementById('c-pv').setAttribute('cy', y(s.pv));
    document.getElementById('c-uv').setAttribute('cx', x(i)); document.getElementById('c-uv').setAttribute('cy', y(s.uv));
    const row = (color, v, name) => el('div', { class: 'row' }, el('i', { style: `background:var(--${color})` }), el('b', { text: fmt.format(v) }), el('span', { text: name }));
    tip.replaceChildren(el('div', { class: 'day', text: dayLabel(s.date, true) + (s.today ? ', so far' : '') }), row('pv', s.pv, 'page views'), row('uv', s.uv, 'visitors'));
    tip.style.display = 'block';
    const left = 8 + x(i), w = tip.offsetWidth;
    tip.style.left = (left + 12 + w > W ? left - 12 - w : left + 12) + 'px';
  }
  function nearest(e) {
    if (!geom) return -1;
    const r = $('svg').getBoundingClientRect(), px = (e.clientX - r.left) * (geom.W / r.width);
    return Math.max(0, Math.min(geom.n - 1, Math.round(((px - geom.m.l) / geom.pw) * (geom.n - 1))));
  }

  function renderDaily() {
    $('daily').hidden = !state.table;
    $('view').textContent = state.table ? 'Show as chart' : 'Show as table';
    $('view').setAttribute('aria-pressed', String(state.table));
    if (!state.table) return;
    const rows = [...series].reverse().map((s) => el('tr', {}, el('td', { text: dayLabel(s.date, true) + (s.today ? ', so far' : '') }), el('td', { class: 'num', text: fmt.format(s.pv) }), el('td', { class: 'num', text: fmt.format(s.uv) })));
    $('daily').replaceChildren(el('table', {}, el('thead', {}, el('tr', {}, el('th', { text: 'Day' }), el('th', { class: 'num', text: 'Page views' }), el('th', { class: 'num', text: 'Visitors' }))), el('tbody', {}, ...rows)));
  }

  const head = (first, sortable) => el('thead', {}, el('tr', {},
    el('th', { text: first }), el('th', { class: 'bar' }),
    ...['pv', 'uv'].map((k) => {
      const name = k === 'pv' ? 'Views' : 'Visitors';
      return sortable
        ? el('th', { class: 'num', 'aria-sort': state.sort === k ? 'descending' : false }, el('button', { text: name, title: 'Sort by ' + name.toLowerCase(), onclick: () => { state.sort = k; renderPages(); } }))
        : el('th', { class: 'num', text: name });
    })));
  const bar = (v, max) => el('td', { class: 'bar' }, el('i', { style: `width:${max ? Math.max(1, (v / max) * 100) : 0}%` }));

  // The pages grouped by the next part of their path. A group opens to its
  // own totals, chart and pages.
  function renderSections() {
    const list = data.sections, max = Math.max(1, ...list.map((s) => s.pv));
    $('sec-count').textContent = list.length ? (state.prefix ? 'under ' + state.prefix : 'by first part of the path') : '';
    if (!list.length) { $('sections').replaceChildren(el('div', { class: 'empty', text: 'No visits in this period.' })); return; }
    const rows = (state.allSections ? list : list.slice(0, 12)).map((s) => {
      // An empty part is the page at the prefix itself, which has nothing below it.
      const own = s.section === '', to = state.prefix + '/' + s.section;
      const name = own
        ? el('span', { text: state.prefix + '/' })
        : el('button', { class: 'drill', text: '/' + s.section, title: 'Show only ' + to, onclick: () => go({ prefix: to }) });
      const sub = !own && s.pages > 1 ? el('span', { class: 'sub', text: fmt.format(s.pages) + ' pages' }) : null;
      return el('tr', {}, el('td', {}, el('div', { class: 'name' }, name, sub)), bar(s.pv, max), el('td', { class: 'num', text: fmt.format(s.pv) }), el('td', { class: 'num', text: fmt.format(s.uv) }));
    });
    const more = !state.allSections && list.length > rows.length ? el('div', { class: 'more' }, el('button', { class: 'link', text: 'Show all ' + fmt.format(list.length) + ' sections', onclick: () => { state.allSections = true; renderSections(); } })) : null;
    $('sections').replaceChildren(el('table', {}, head('Section'), el('tbody', {}, ...rows)), ...(more ? [more] : []));
  }

  function renderPages() {
    const q = state.q.trim().toLowerCase();
    const all = data.paths.filter((p) => !q || p.path.toLowerCase().includes(q)).sort((a, b) => b[state.sort] - a[state.sort] || b.pv - a.pv);
    const max = Math.max(1, ...all.map((p) => p[state.sort]));
    const shown = state.all ? all : all.slice(0, 50);
    const total = data.summary.pages;
    $('page-count').textContent = q ? fmt.format(all.length) + ' match' : data.paths.length < total ? 'top ' + fmt.format(data.paths.length) + ' of ' + fmt.format(total) : fmt.format(total);
    if (!all.length) { $('pages').replaceChildren(el('div', { class: 'empty', text: q ? 'No page matches.' : 'No visits in this period.' })); return; }
    const rows = shown.map((p) => el('tr', {},
      el('td', {}, el('a', { href: 'https://' + state.host + p.path, target: '_blank', rel: 'noopener', title: p.path, text: p.path })),
      bar(p[state.sort], max), el('td', { class: 'num', text: fmt.format(p.pv) }), el('td', { class: 'num', text: fmt.format(p.uv) })));
    const more = all.length > shown.length ? el('div', { class: 'more' }, el('button', { class: 'link', text: 'Show all ' + fmt.format(all.length) + ' pages', onclick: () => { state.all = true; renderPages(); } })) : null;
    $('pages').replaceChildren(el('table', {}, head('Page', true), el('tbody', {}, ...rows)), ...(more ? [more] : []));
  }

  function go(change) {
    Object.assign(state, change);
    hover = -1;
    load(true);
  }

  $('host').addEventListener('change', (e) => go({ host: e.target.value, prefix: '' }));
  $('days').addEventListener('click', (e) => { const d = +e.target.dataset?.days; if (d && d !== state.days) go({ days: d }); });
  $('q').addEventListener('input', (e) => { state.q = e.target.value; state.all = false; if (data) renderPages(); });
  $('view').addEventListener('click', () => { state.table = !state.table; renderChart(); renderDaily(); });
  const svg = $('svg');
  svg.addEventListener('pointermove', (e) => point(nearest(e)));
  svg.addEventListener('pointerleave', () => { if (document.activeElement !== svg) point(-1); });
  svg.addEventListener('focus', () => { if (hover < 0 && geom) point(geom.n - 1); });
  svg.addEventListener('blur', () => point(-1));
  svg.addEventListener('keydown', (e) => {
    if (!geom) return;
    if (e.key === 'ArrowLeft') point(Math.max(0, (hover < 0 ? geom.n : hover) - 1));
    else if (e.key === 'ArrowRight') point(Math.min(geom.n - 1, hover + 1));
    else if (e.key === 'Escape') point(-1);
    else return;
    e.preventDefault();
  });
  new ResizeObserver(() => { if (data) renderChart(); }).observe($('plot'));
  window.addEventListener('popstate', () => { readURL(); hover = -1; load(false); });

  readURL();
  load(false);
})();
</script>
</body>
</html>
