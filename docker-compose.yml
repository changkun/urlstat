services:
  urlstat:
    restart: always
    image: urlstat:latest
    deploy:
      replicas: 1
    environment:
      - URLSTAT_DB=postgres://urlstat:urlstat@postgres:5432/urlstat?sslmode=disable
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - traefik_proxy
      - postgres_internal

networks:
  traefik_proxy:
    external: true
  # Owned by changkun/proxy, which runs the shared database instance.
  # depends_on cannot reach across compose projects, so ordering against
  # the database is handled by restart: always rather than declaratively.
  postgres_internal:
    external: true
